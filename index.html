<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caricamento...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .loader-png {
      max-width: 70vw;  
      max-height: 60vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .brand-text {
      margin-top: 24px;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>

  <img src="logo.png" alt="Logo" class="loader-png">
  <div class="brand-text">Armadillo Interactive</div>

  <script>
    fetch('stream.json?t=' + Date.now())
      .then(response => response.json())
      .then(data => {
        if (data.url) {
          // Aspetta 3000 millisecondi (3 secondi) prima di reindirizzare
          setTimeout(() => {
            window.location.href = data.url;
          }, 3000);
        }
      })
      .catch(err => {
        console.error("Errore nel caricamento del link:", err);
      });
  </script>

</body>
</html>
