<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armadillo Streams</title>

  <!-- Favicon e Icone per Barra delle Applicazioni -->
  <link rel="icon" type="image/x-icon" href="armadillo.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="armadillo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="armadillo.png">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #020b18 0%, #081b3b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Schermata di Caricamento (Splash Screen) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #020b18 0%, #081b3b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease, visibility 1s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .splash-logo {
      width: 650px;
      height: 650px;
      object-fit: contain;
      animation: logoScaleEntrance 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes logoScaleEntrance {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    .card {
      background: rgba(13, 27, 54, 0.85);
      border: 1px solid #1d4ed8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      padding: 35px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .badge-active { background: #16a34a; color: #fff; }
    .badge-next { background: #2563eb; color: #fff; }
    .badge-inactive { background: #ef4444; color: #fff; }
    .badge-overlap { background: #eab308; color: #000; }
    
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
    
    .redirect-note {
      font-size: 0.85rem;
      margin-top: 15px;
      color: #94a3b8;
    }
    .redirect-note strong { color: #60a5fa; }
    
    .countdown-box {
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid #2563eb;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 15px;
    }
    .countdown-box strong {
      color: #60a5fa;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }
    .error-box { 
      background: rgba(239, 68, 68, 0.1); 
      border: 1px solid #ef4444; 
      padding: 10px; 
      border-radius: 8px; 
      font-family: monospace; 
      font-size: 0.8rem; 
      color: #fca5a5; 
      margin-top: 10px; 
      text-align: left; 
      word-break: break-all; 
    }
    
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      text-align: center;
    }
    .btn-live { 
      background: #16a34a; 
      color: #ffffff; 
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4); 
    }
    .btn-live:hover { background: #15803d; transform: translateY(-1px); }
    .btn-inter { background: #0284c7; color: #ffffff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4); }
    .btn-inter:hover { background: #0369a1; transform: translateY(-1px); }
    .btn-f1 { background: #dc2626; color: #ffffff; box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4); }
    .btn-f1:hover { background: #b91c1c; transform: translateY(-1px); }
    .btn-disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Schermata di Caricamento (Splash Screen) -->
  <div id="splash-screen">
    <img src="logo.png" alt="Logo Armadillo" class="splash-logo">
  </div>

  <div class="card" id="app">
    <div class="badge badge-next">Verifica in corso...</div>
    <h1>Connessione al server...</h1>
  </div>

  <script>
    const REPO_USER = 'Wwhiplashh';
    const REPO_NAME = 'ArmadilloStreams';

    const BASE_URL = window.location.protocol === 'file:' 
      ? `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/`
      : './';

    const STREAM_JSON_URL = `${BASE_URL}stream.json`;
    const CALENDAR_JSON_URL = `${BASE_URL}calendar.json`;
    const F1_CALENDAR_JSON_URL = `${BASE_URL}f1_calendar.json`;

    function nascondiSplash(startTime, minDisplayTime = 2500) {
      const elapsedTime = Date.now() - startTime;
      const remainingTime = Math.max(0, minDisplayTime - elapsedTime);
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('fade-out');
      }, remainingTime);
    }

    function isEventoLive(evento, adesso) {
      if (!evento || !evento.attivo || !evento.url || evento.in_chiaro) return false;
      
      const cinqueMinutiInMs = 5 * 60 * 1000;
      if (evento.data && evento.ora) {
        // Interpreta l'orario come orario locale del dispositivo (gestisce solare e legale automaticamente)
        const matchTime = new Date(`${evento.data}T${evento.ora}:00`);
        return adesso >= (matchTime.getTime() - cinqueMinutiInMs);
      }
      return evento.attivo;
    }

    async function checkMatch() {
      const app = document.getElementById('app');
      const startTime = Date.now();

      try {
        const response = await fetch(STREAM_JSON_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status} caricando stream.json`);
        const streamData = await response.json();

        const adesso = new Date();

        // Estrazione eventi (compatibile sia con struttura nuova che vecchia)
        const eventoInter = streamData.inter || (streamData.partita ? streamData : null);
        const eventoF1 = streamData.f1 || null;

        const interLive = isEventoLive(eventoInter, adesso);
        const f1Live = isEventoLive(eventoF1, adesso);

        // CASE 1: CONCOMITANZA (Sia Inter che F1 sono in diretta)
        if (interLive && f1Live) {
          app.innerHTML = `
            <span class="badge badge-overlap">⚠️ Sovrapposizione Eventi</span>
            <h1>Due eventi in diretta</h1>
            <p>Seleziona lo streaming che desideri guardare:</p>
            <div class="btn-container">
              <a href="${eventoInter.url}" class="btn btn-inter">⚽ INTER: ${eventoInter.partita}</a>
              <a href="${eventoF1.url}" class="btn btn-f1">🏎️ F1: ${eventoF1.partita}</a>
            </div>
          `;
          nascondiSplash(startTime);
          return;
        }

        // CASE 2: SOLO UN EVENTO IN DIRETTA
        const eventoAttivo = interLive ? eventoInter : (f1Live ? eventoF1 : null);
        const tipoEvento = interLive ? "⚽ Inter" : "🏎️ Formula 1";

        if (eventoAttivo) {
          let secondiRimanenti = 3;

          app.innerHTML = `
            <span class="badge badge-active">🔴 ${tipoEvento} In Diretta</span>
            <h1>${eventoAttivo.partita}</h1>
            <p>
              <strong>Competizione:</strong> ${eventoAttivo.competizione}<br>
              <strong>Trasmissione:</strong> ${eventoAttivo.servizio}
            </p>
            <a href="${eventoAttivo.url}" class="btn btn-live">AVVIA LO STREAMING</a>
            <p class="redirect-note">
              Reindirizzamento automatico tra <strong id="countdown">3</strong> secondi...
            </p>
          `;

          nascondiSplash(startTime);

          const timerEl = document.getElementById('countdown');
          const interval = setInterval(() => {
            secondiRimanenti--;
            if (timerEl) timerEl.textContent = secondiRimanenti;
            
            if (secondiRimanenti <= 0) {
              clearInterval(interval);
              window.location.href = eventoAttivo.url;
            }
          }, 1000);
          return;
        }

        // CASE 3: NESSUN EVENTO IN DIRETTA -> MOSTRA PROSSIMO EVENTO DALLA LISTA
        await mostraProssimoEvento(adesso, startTime);

      } catch (err) {
        app.innerHTML = `
          <span class="badge badge-inactive">Errore Stream</span>
          <h1>Impossibile caricare i dati dello stream</h1>
          <div class="error-box">${err.message}</div>
        `;
        nascondiSplash(startTime);
      }
    }

    async function mostraProssimoEvento(adesso, startTime) {
      const app = document.getElementById('app');
      let tuttiEventi = [];

      // Carica calendario Inter
      try {
        const calRes = await fetch(CALENDAR_JSON_URL, { cache: 'no-store' });
        if (calRes.ok) {
          const data = await calRes.json();
          const me = Array.isArray(data) ? data : (data.partite || []);
          me.forEach(e => tuttiEventi.push({ ...e, tipo: 'inter' }));
        }
      } catch (e) {}

      // Carica calendario F1
      try {
        const f1Res = await fetch(F1_CALENDAR_JSON_URL, { cache: 'no-store' });
        if (f1Res.ok) {
          const dataF1 = await f1Res.json();
          const meF1 = Array.isArray(dataF1) ? dataF1 : (dataF1.gare || dataF1.races || []);
          meF1.forEach(e => tuttiEventi.push({ ...e, tipo: 'f1' }));
        }
      } catch (e) {}

      // Trova il prossimo evento futuro più vicino
      let prossimo = null;
      let minDiff = Infinity;

      tuttiEventi.forEach(ev => {
        if (!ev.data) return;
        const oraUtc = ev.ora || ev.orario || "14:00";
        const evDate = new Date(`${ev.data}T${oraUtc}:00Z`);
        const diff = evDate - adesso;
        
        // Eventi futuri o iniziati da meno di 2 ore
        if (diff > -2 * 60 * 60 * 1000 && diff < minDiff) {
          minDiff = diff;
          prossimo = { ...ev, targetDate: evDate };
        }
      });

      if (prossimo) {
        const dataRaw = prossimo.targetDate.toLocaleDateString('it-IT', {
          timeZone: 'Europe/Rome',
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        const dataFormattata = dataRaw.charAt(0).toUpperCase() + dataRaw.slice(1);
        const oraItaliana = prossimo.targetDate.toLocaleTimeString('it-IT', {
          timeZone: 'Europe/Rome',
          hour: '2-digit',
          minute: '2-digit'
        });

        const icona = prossimo.tipo === 'f1' ? '🏎️' : '⚽';

        app.innerHTML = `
          <span class="badge badge-next">Prossimo Evento</span>
          <h1>${icona} ${prossimo.partita}</h1>
          <p>
            <strong>Data:</strong> ${dataFormattata} (${oraItaliana})<br>
            <strong>Competizione:</strong> ${prossimo.competizione}<br>
            <strong>Piattaforma:</strong> ${prossimo.servizio || 'Sky / NOW'}
          </p>
          <div class="countdown-box">
            Inizio tra:<br>
            <strong id="match-countdown">Calcolo in corso...</strong>
          </div>
        `;

        function aggiornaCountdown() {
          const adessoOra = new Date();
          const differenza = prossimo.targetDate - adessoOra;

          const countdownEl = document.getElementById('match-countdown');
          if (!countdownEl) return;

          if (differenza <= 0) {
            countdownEl.textContent = "Evento in corso!";
            setTimeout(() => location.reload(), 3000);
            return;
          }

          const giorni = Math.floor(differenza / (1000 * 60 * 60 * 24));
          const ore = Math.floor((differenza % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minuti = Math.floor((differenza % (1000 * 60 * 60)) / (1000 * 60));
          const secondi = Math.floor((differenza % (1000 * 60)) / 1000);

          let testo = "";
          if (giorni > 0) testo += `${giorni}g `;
          testo += `${ore}h ${minuti}m ${secondi}s`;

          countdownEl.textContent = testo;
        }

        aggiornaCountdown();
        setInterval(aggiornaCountdown, 1000);

      } else {
        app.innerHTML = `
          <span class="badge badge-inactive">Nessun Evento</span>
          <h1>Nessun evento in programma</h1>
          <p>Non ci sono prossime gare o partite registrate nei calendari.</p>
          <button disabled class="btn btn-disabled">Nessuno Stream Attivo</button>
        `;
      }

      nascondiSplash(startTime);
    }

    checkMatch();
  </script>
</body>

<body>

  <!-- Schermata di Caricamento (Splash Screen) -->
  <div id="splash-screen">
    <img src="logo.png" alt="Logo Armadillo" class="splash-logo">
  </div>

  <div class="card" id="app">
    <div class="badge badge-next">Verifica in corso...</div>
    <h1>Connessione al server...</h1>
  </div>

  <script>
    const REPO_USER = 'Wwhiplashh';
    const REPO_NAME = 'ArmadilloStreams';

    const BASE_URL = window.location.protocol === 'file:' 
      ? `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/`
      : './';

    const STREAM_JSON_URL = `${BASE_URL}stream.json`;
    const CALENDAR_JSON_URL = `${BASE_URL}calendar.json`;

    async function checkMatch() {
      const app = document.getElementById('app');
      const startTime = Date.now();
      const minDisplayTime = 2500; 

      try {
        const response = await fetch(STREAM_JSON_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status} caricando stream.json`);
        const streamData = await response.json();

        const adesso = new Date();
        
        // Calcolo della data e ora del match con fuso orario italiano CEST (+02:00)
        let matchTime = null;
        if (streamData.data && (streamData.ora || streamData.orario)) {
          const orarioLocale = streamData.ora || streamData.orario;
          matchTime = new Date(`${streamData.data}T${orarioLocale}:00+02:00`);
        }

        // Finestra di reindirizzamento: 5 minuti prima dell'inizio o a partita in corso
        const cinqueMinutiInMs = 5 * 60 * 1000;
        const isInFinestraDiretta = matchTime 
          ? (adesso >= (matchTime.getTime() - cinqueMinutiInMs))
          : streamData.attivo;

        if (streamData.attivo && streamData.url && isInFinestraDiretta) {
          let secondiRimanenti = 3;

          app.innerHTML = `
            <span class="badge badge-active">🔴 In Diretta Oggi</span>
            <h1>${streamData.partita}</h1>
            <p>
              <strong>Competizione:</strong> ${streamData.competizione}<br>
              <strong>Trasmissione:</strong> ${streamData.servizio}
            </p>
            <a href="${streamData.url}" class="btn btn-live">AVVIA LO STREAMING</a>
            <p class="redirect-note">
              Reindirizzamento automatico tra <strong id="countdown">3</strong> secondi...
            </p>
          `;

          const elapsedTime = Date.now() - startTime;
          const remainingTime = Math.max(0, minDisplayTime - elapsedTime);

          setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) splash.classList.add('fade-out');
          }, remainingTime);

          const timerEl = document.getElementById('countdown');
          const interval = setInterval(() => {
            secondiRimanenti--;
            if (timerEl) timerEl.textContent = secondiRimanenti;
            
            if (secondiRimanenti <= 0) {
              clearInterval(interval);
              window.location.href = streamData.url;
            }
          }, 1000);

        } else {
          try {
            const calResponse = await fetch(CALENDAR_JSON_URL, { cache: 'no-store' });
            if (!calResponse.ok) throw new Error(`HTTP ${calResponse.status} caricando calendar.json`);
            
            const dataCal = await calResponse.json();
            const calendario = Array.isArray(dataCal) ? dataCal : (dataCal.partite || []);

            const prossimaPartita = calendario.find(p => {
              if (!p.data) return false;
              const matchOraUtc = p.ora || p.orario || "18:45";
              const targetDate = new Date(`${p.data}T${matchOraUtc}:00Z`);
              return targetDate >= (adesso - 2 * 60 * 60 * 1000);
            });

            if (prossimaPartita) {
              const matchOraUtc = prossimaPartita.ora || prossimaPartita.orario || "18:45";
              const targetDate = new Date(`${prossimaPartita.data}T${matchOraUtc}:00Z`);

              const dataRaw = targetDate.toLocaleDateString('it-IT', {
                timeZone: 'Europe/Rome',
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
              });
              const dataFormattata = dataRaw.charAt(0).toUpperCase() + dataRaw.slice(1);

              const oraItaliana = targetDate.toLocaleTimeString('it-IT', {
                timeZone: 'Europe/Rome',
                hour: '2-digit',
                minute: '2-digit'
              });

              app.innerHTML = `
                <span class="badge badge-next">Prossimo Match</span>
                <h1>${prossimaPartita.partita}</h1>
                <p>
                  <strong>Data:</strong> ${dataFormattata} (${oraItaliana})<br>
                  <strong>Competizione:</strong> ${prossimaPartita.competizione}<br>
                  <strong>Piattaforma:</strong> ${prossimaPartita.servizio}
                </p>
                <div class="countdown-box">
                  Inizio tra:<br>
                  <strong id="match-countdown">Calcolo in corso...</strong>
                </div>
              `;

              function aggiornaCountdown() {
                const adessoOra = new Date();
                const differenza = targetDate - adessoOra;

                const countdownEl = document.getElementById('match-countdown');
                if (!countdownEl) return;

                if (differenza <= 0) {
                  countdownEl.textContent = "Match in corso o appena iniziato!";
                  setTimeout(() => location.reload(), 2000);
                  return;
                }

                const giorni = Math.floor(differenza / (1000 * 60 * 60 * 24));
                const ore = Math.floor((differenza % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minuti = Math.floor((differenza % (1000 * 60 * 60)) / (1000 * 60));
                const secondi = Math.floor((differenza % (1000 * 60)) / 1000);

                let testo = "";
                if (giorni > 0) testo += `${giorni}g `;
                testo += `${ore}h ${minuti}m ${secondi}s`;

                countdownEl.textContent = testo;
              }

              aggiornaCountdown();
              setInterval(aggiornaCountdown, 1000);

            } else {
              app.innerHTML = `
                <span class="badge badge-inactive">Nessun Evento</span>
                <h1>Nessuna partita in programma</h1>
                <p>Non ci sono prossime partite registrate nel calendario.</p>
                <button disabled class="btn btn-disabled">Nessuno Stream Attivo</button>
              `;
            }
          } catch (calErr) {
            app.innerHTML = `
              <span class="badge badge-inactive">Errore Calendario</span>
              <h1>Errore nel caricamento del calendario</h1>
              <p>Dettaglio dell'errore:</p>
              <div class="error-box">${calErr.message}</div>
              <button disabled class="btn btn-disabled" style="margin-top:15px">Nessuno Stream Attivo</button>
            `;
          }

          const elapsedTime = Date.now() - startTime;
          const remainingTime = Math.max(0, minDisplayTime - elapsedTime);

          setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) splash.classList.add('fade-out');
          }, remainingTime);
        }
      } catch (err) {
        app.innerHTML = `
          <span class="badge badge-inactive">Errore Stream</span>
          <h1>Impossibile caricare i dati dello stream</h1>
          <div class="error-box">${err.message}</div>
        `;

        const elapsedTime = Date.now() - startTime;
        const remainingTime = Math.max(0, minDisplayTime - elapsedTime);

        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) splash.classList.add('fade-out');
        }, remainingTime);
      }
    }

    checkMatch();
  </script>
</body>
</html>
