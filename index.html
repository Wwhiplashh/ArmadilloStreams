<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armadillo Streams</title>

  <!-- Favicon e Icone per Barra delle Applicazioni -->
  <link rel="icon" type="image/x-icon" href="armadillo.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="armadillo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="armadillo.png">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #020b18 0%, #081b3b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Schermata di Caricamento (Splash Screen) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #020b18 0%, #081b3b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 350px;
      max-width: 80vw;
      height: auto;
      object-fit: contain;
      animation: logoScaleEntrance 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes logoScaleEntrance {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .card {
      background: rgba(13, 27, 54, 0.85);
      border: 1px solid #1d4ed8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      padding: 35px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .badge-active { background: #16a34a; color: #fff; }
    .badge-next { background: #2563eb; color: #fff; }
    .badge-inactive { background: #ef4444; color: #fff; }
    .badge-overlap { background: #eab308; color: #000; }
    
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
    
    .redirect-note {
      font-size: 0.85rem;
      margin-top: 15px;
      color: #94a3b8;
    }
    .redirect-note strong { color: #60a5fa; }
    
    .countdown-box {
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid #2563eb;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 15px;
    }
    .countdown-box strong {
      color: #60a5fa;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }
    .error-box { 
      background: rgba(239, 68, 68, 0.1); 
      border: 1px solid #ef4444; 
      padding: 10px; 
      border-radius: 8px; 
      font-family: monospace; 
      font-size: 0.8rem; 
      color: #fca5a5; 
      margin-top: 10px; 
      text-align: left; 
      word-break: break-all; 
    }
    
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      text-align: center;
    }
    .btn-live { 
      background: #16a34a; 
      color: #ffffff; 
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4); 
    }
    .btn-live:hover { background: #15803d; transform: translateY(-1px); }
    .btn-inter { background: #0284c7; color: #ffffff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4); }
    .btn-inter:hover { background: #0369a1; transform: translateY(-1px); }
    .btn-f1 { background: #dc2626; color: #ffffff; box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4); }
    .btn-f1:hover { background: #b91c1c; transform: translateY(-1px); }
    .btn-disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Schermata di Caricamento (Splash Screen) -->
  <div id="splash-screen">
    <img src="logo.png" alt="Logo Armadillo" class="splash-logo" onerror="this.src='armadillo.png'">
  </div>

  <div class="card" id="app">
    <div class="badge badge-next">Verifica in corso...</div>
    <h1>Connessione al server...</h1>
  </div>

  <script>
    const REPO_USER = 'Wwhiplashh';
    const REPO_NAME = 'ArmadilloStreams';

    const BASE_URL = window.location.protocol === 'file:' 
      ? `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/`
      : './';

    const STREAM_JSON_URL = `${BASE_URL}stream.json`;
    const CALENDAR_JSON_URL = `${BASE_URL}calendar.json`;
    const F1_CALENDAR_JSON_URL = `${BASE_URL}f1_calendar.json`;

    function nascondiSplash() {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('fade-out');
      }, 300);
    }

    function normalizzaOra(oraRaw) {
      if (!oraRaw) return "14:00";
      let str = String(oraRaw).trim().replace("Z", "");
      const parti = str.split(":");
      if (parti.length >= 2) {
        const hh = parti[0].padStart(2, "0");
        const mm = parti[1].padStart(2, "0");
        return `${hh}:${mm}`;
      }
      return "14:00";
    }

    function isEventoLive(evento, adesso) {
      if (!evento || !evento.attivo || !evento.url || evento.in_chiaro) return false;
      
      if (evento.data && evento.ora) {
        const oraPulita = normalizzaOra(evento.ora);
        const matchTime = new Date(`${evento.data}T${oraPulita}:00`);
        if (!isNaN(matchTime.getTime())) {
          const cinqueMinutiInMs = 5 * 60 * 1000;
          return adesso >= (matchTime.getTime() - cinqueMinutiInMs);
        }
      }
      return Boolean(evento.attivo);
    }

    async function initApp() {
      const app = document.getElementById('app');

      try {
        const [streamRes, calRes, f1CalRes] = await Promise.allSettled([
          fetch(STREAM_JSON_URL, { cache: 'no-store' }),
          fetch(CALENDAR_JSON_URL, { cache: 'no-store' }),
          fetch(F1_CALENDAR_JSON_URL, { cache: 'no-store' })
        ]);

        let streamData = {};
        if (streamRes.status === 'fulfilled' && streamRes.value.ok) {
          streamData = await streamRes.value.json();
        } else {
          throw new Error("Impossibile caricare stream.json.");
        }

        let calendarioInter = [];
        if (calRes.status === 'fulfilled' && calRes.value.ok) {
          const data = await calRes.value.json();
          calendarioInter = Array.isArray(data) ? data : (data.partite || data.eventi || []);
        }

        let calendarioF1 = [];
        if (f1CalRes.status === 'fulfilled' && f1CalRes.value.ok) {
          const dataF1 = await f1CalRes.value.json();
          calendarioF1 = Array.isArray(dataF1) ? dataF1 : (dataF1.gare || dataF1.races || dataF1.partite || dataF1.eventi || []);
        }

        const adesso = new Date();
        const eventoInter = streamData.inter || (streamData.partita ? streamData : null);
        const eventoF1 = streamData.f1 || null;

        const interLive = isEventoLive(eventoInter, adesso);
        const f1Live = isEventoLive(eventoF1, adesso);

        // CASO 1: CONCOMITANZA (Sia Inter che F1 sono in diretta)
        if (interLive && f1Live) {
          app.innerHTML = `
            <span class="badge badge-overlap">⚠️ Sovrapposizione Eventi</span>
            <h1>Due eventi in diretta</h1>
            <p>Seleziona lo streaming che desideri guardare:</p>
            <div class="btn-container">
              <a href="${eventoInter.url}" class="btn btn-inter">⚽ INTER: ${eventoInter.partita || eventoInter.titolo || 'Partita Inter'}</a>
              <a href="${eventoF1.url}" class="btn btn-f1">🏎️ F1: ${eventoF1.partita || eventoF1.gara || eventoF1.nome || 'Gara F1'}</a>
            </div>
          `;
          return;
        }

        // CASO 2: UN SOLO EVENTO IN DIRETTA
        const eventoAttivo = interLive ? eventoInter : (f1Live ? eventoF1 : null);
        const tipoEvento = interLive ? "⚽ Inter" : "🏎️ Formula 1";

        if (eventoAttivo) {
          let secondiRimanenti = 3;
          const titoloEvento = eventoAttivo.partita || eventoAttivo.gara || eventoAttivo.nome || 'Evento in Diretta';

          app.innerHTML = `
            <span class="badge badge-active">🔴 ${tipoEvento} In Diretta</span>
            <h1>${titoloEvento}</h1>
            <p>
              <strong>Competizione:</strong> ${eventoAttivo.competizione || (interLive ? 'Serie A / Champions' : 'Formula 1')}<br>
              <strong>Trasmissione:</strong> ${eventoAttivo.servizio || 'Streaming'}
            </p>
            <a href="${eventoAttivo.url}" class="btn btn-live">AVVIA LO STREAMING</a>
            <p class="redirect-note">
              Reindirizzamento automatico tra <strong id="countdown">3</strong> secondi...
            </p>
          `;

          const timerEl = document.getElementById('countdown');
          const interval = setInterval(() => {
            secondiRimanenti--;
            if (timerEl) timerEl.textContent = secondiRimanenti;
            
            if (secondiRimanenti <= 0) {
              clearInterval(interval);
              window.location.href = eventoAttivo.url;
            }
          }, 1000);
          return;
        }

        // CASO 3: NESSUN EVENTO IN DIRETTA -> MOSTRA PROSSIMO EVENTO DAI CALENDARI
        mostraProssimoEvento(adesso, calendarioInter, calendarioF1);

      } catch (err) {
        app.innerHTML = `
          <span class="badge badge-inactive">Errore Stream</span>
          <h1>Impossibile caricare i dati dello stream</h1>
          <div class="error-box">${err.message}</div>
        `;
      } finally {
        nascondiSplash();
      }
    }

    function mostraProssimoEvento(adesso, calendarioInter, calendarioF1) {
      const app = document.getElementById('app');
      let tuttiEventi = [];

      calendarioInter.forEach(e => tuttiEventi.push({ ...e, tipo: 'inter' }));
      calendarioF1.forEach(e => tuttiEventi.push({ ...e, tipo: 'f1' }));

      let prossimo = null;
      let minDiff = Infinity;

      tuttiEventi.forEach(ev => {
        if (!ev.data) return;
        const oraPulita = normalizzaOra(ev.ora || ev.orario);
        
        // Interpreta la data come ora locale senza 'Z' per evitare disallineamenti
        const evDate = new Date(`${ev.data}T${oraPulita}:00`);
        
        if (isNaN(evDate.getTime())) return;

        const diff = evDate - adesso;
        
        // Eventi futuri o iniziati da meno di 2 ore
        if (diff > -2 * 60 * 60 * 1000 && diff < minDiff) {
          minDiff = diff;
          prossimo = { ...ev, targetDate: evDate };
        }
      });

      if (prossimo) {
        const dataRaw = prossimo.targetDate.toLocaleDateString('it-IT', {
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        const dataFormattata = dataRaw.charAt(0).toUpperCase() + dataRaw.slice(1);
        const oraFormattata = prossimo.targetDate.toLocaleTimeString('it-IT', {
          hour: '2-digit',
          minute: '2-digit'
        });

        const icona = prossimo.tipo === 'f1' ? '🏎️' : '⚽';
        const titoloEvento = prossimo.partita || prossimo.gara || prossimo.nome || prossimo.titolo || 'Prossimo Evento';
        const compEvento = prossimo.competizione || (prossimo.tipo === 'f1' ? 'Formula 1' : 'Serie A');

        app.innerHTML = `
          <span class="badge badge-next">Prossimo Evento</span>
          <h1>${icona} ${titoloEvento}</h1>
          <p>
            <strong>Data:</strong> ${dataFormattata} (${oraFormattata})<br>
            <strong>Competizione:</strong> ${compEvento}<br>
            <strong>Piattaforma:</strong> ${prossimo.servizio || 'Sky / NOW'}
          </p>
          <div class="countdown-box">
            Inizio tra:<br>
            <strong id="match-countdown">Calcolo in corso...</strong>
          </div>
        `;

        let countdownInterval = null;

        function aggiornaCountdown() {
          const adessoOra = new Date();
          const differenza = prossimo.targetDate - adessoOra;

          const countdownEl = document.getElementById('match-countdown');
          if (!countdownEl) return;

          if (differenza <= 0) {
            countdownEl.textContent = "Evento in corso!";
            if (countdownInterval) clearInterval(countdownInterval);
            setTimeout(() => location.reload(), 3000);
            return;
          }

          const giorni = Math.floor(differenza / (1000 * 60 * 60 * 24));
          const ore = Math.floor((differenza % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minuti = Math.floor((differenza % (1000 * 60 * 60)) / (1000 * 60));
          const secondi = Math.floor((differenza % (1000 * 60)) / 1000);

          let testo = "";
          if (giorni > 0) testo += `${giorni}g `;
          testo += `${ore}h ${minuti}m ${secondi}s`;

          countdownEl.textContent = testo;
        }

        aggiornaCountdown();
        countdownInterval = setInterval(aggiornaCountdown, 1000);

      } else {
        app.innerHTML = `
          <span class="badge badge-inactive">Nessun Evento</span>
          <h1>Nessun evento in programma</h1>
          <p>Non ci sono prossime gare o partite registrate nei calendari.</p>
          <button disabled class="btn btn-disabled">Nessuno Stream Attivo</button>
        `;
      }
    }

    initApp();
  </script>
</body>
</html>
