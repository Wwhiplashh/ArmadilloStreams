<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armadillo Streams</title>

  <!-- Favicon e Icone per Barra delle Applicazioni -->
  <link rel="icon" type="image/x-icon" href="armadillo.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="armadillo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="armadillo.png">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #020b18 0%, #081b3b 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Schermata di Caricamento (Splash Screen) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #020b18 0%, #081b3b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 650px;
      height: 650px;
      object-fit: contain;
      animation: logoScaleEntrance 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes logoScaleEntrance {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* Container Griglia Cards */
    .cards-container {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
      align-items: stretch;
      max-width: 1000px;
      width: 100%;
    }

    .card {
      background: rgba(13, 27, 54, 0.85);
      border: 1px solid #1d4ed8;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      padding: 35px;
      flex: 1 1 420px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      align-self: center;
    }
    .badge-active { background: #16a34a; color: #fff; }
    .badge-next { background: #2563eb; color: #fff; }
    .badge-inactive { background: #ef4444; color: #fff; }
    .badge-prime { background: #00A8E1; color: #020b18; }

    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
    .redirect-note {
      font-size: 0.85rem;
      margin-top: 15px;
      color: #94a3b8;
    }
    .redirect-note strong { color: #60a5fa; }
    .countdown-box {
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid #2563eb;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 15px;
    }
    .countdown-box strong {
      color: #60a5fa;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }
    
    /* Box avviso centrato */
    .notice-box-prime {
      background: rgba(0, 168, 225, 0.1);
      border-left: 4px solid #00A8E1;
      padding: 12px 15px;
      border-radius: 6px;
      margin: 15px 0;
      text-align: center;
      font-size: 0.88rem;
      color: #e2e8f0;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    
    .error-box { 
      background: rgba(239, 68, 68, 0.1); 
      border: 1px solid #ef4444; 
      padding: 10px; 
      border-radius: 8px; 
      font-family: monospace; 
      font-size: 0.8rem; 
      color: #fca5a5; 
      margin-top: 10px; 
      text-align: left; 
      word-break: break-all; 
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }
    .btn-live { 
      background: #16a34a; 
      color: #ffffff; 
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4); 
    }
    .btn-live:hover { background: #15803d; transform: translateY(-1px); }
    .btn-disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Schermata di Caricamento (Splash Screen) -->
  <div id="splash-screen">
    <img src="logo.png" alt="Logo Armadillo" class="splash-logo">
  </div>

  <div class="cards-container">
    <!-- Card 1: Inter / Calcio -->
    <div class="card" id="app-inter">
      <div>
        <span class="badge badge-next">Verifica in corso...</span>
        <h1>Connessione Inter...</h1>
      </div>
    </div>

    <!-- Card 2: Formula 1 -->
    <div class="card" id="app-f1">
      <div>
        <span class="badge badge-next">Verifica in corso...</span>
        <h1>Connessione Formula 1...</h1>
      </div>
    </div>
  </div>

<script>
    const REPO_USER = 'Wwhiplashh';
    const REPO_NAME = 'ArmadilloStreams';

    const BASE_URL = window.location.protocol === 'file:' 
      ? `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/`
      : './';

    function hideSplashScreen(startTime) {
      const minDisplayTime = 2000; 
      const elapsedTime = Date.now() - startTime;
      const remainingTime = Math.max(0, minDisplayTime - elapsedTime);

      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(() => { splash.style.display = 'none'; }, 800);
        }
      }, remainingTime);
    }

    async function loadEventCard(config) {
      const { elementId, streamUrl, calendarUrl, defaultTitle, countdownPrefix } = config;
      const app = document.getElementById(elementId);

      try {
        const response = await fetch(streamUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status} caricando stream.json`);
        const streamData = await response.json();

        const isAttivo = streamData.attivo === true || streamData.attivo === 'true';

        // 1. EVENTO ATTIVO OGGI
        if (isAttivo) {
          const isPrimeVideo = streamData.servizio && streamData.servizio.toLowerCase().includes("prime video");
          const nomeEvento = streamData.partita || streamData.gran_premio || streamData.evento || defaultTitle;

          if (isPrimeVideo) {
            app.innerHTML = `
              <div>
                <span class="badge badge-prime">📦 Esclusiva Prime Video</span>
                <h1>${nomeEvento}</h1>
                <p>
                  <strong>Competizione:</strong> ${streamData.competizione || '-'}<br>
                  <strong>Trasmissione:</strong> Amazon Prime Video
                </p>
                <div class="notice-box-prime">
                  <div>ℹ️ <strong>Nota:</strong></div>
                  <div>Questa trasmissione è un'esclusiva <strong>Prime Video</strong>,<br>non sarà disponibile su Armadillo Streams.</div>
                </div>
              </div>
            `;
            return { attivo: false };
          }

          if (streamData.url) {
            app.innerHTML = `
              <div>
                <span class="badge badge-active">🔴 In Diretta Oggi</span>
                <h1>${nomeEvento}</h1>
                <p>
                  <strong>Competizione:</strong> ${streamData.competizione || '-'}<br>
                  <strong>Trasmissione:</strong> ${streamData.servizio || '-'}
                </p>
                <a href="${streamData.url}" target="_blank" class="btn btn-live">AVVIA LO STREAMING</a>
                <p class="redirect-note" id="${countdownPrefix}-note">
                  Reindirizzamento automatico tra <strong id="${countdownPrefix}-cd">3</strong> secondi...
                </p>
              </div>
            `;

            return { 
              attivo: true, 
              url: streamData.url, 
              countdownPrefix 
            };
          }
        }

        // 2. NESSUNO STREAM ATTIVO -> PROSSIMO MATCH/GP DAL CALENDARIO
        try {
          const calResponse = await fetch(calendarUrl, { cache: 'no-store' });
          if (!calResponse.ok) throw new Error(`HTTP ${calResponse.status} caricando calendar.json`);
          
          const dataCal = await calResponse.json();
          const calendario = Array.isArray(dataCal) ? dataCal : (dataCal.partite || dataCal.gare || []);
          const adesso = new Date();

          const prossimoEvento = calendario.find(p => {
            if (!p || !p.data) return false;
            const matchOraUtc = p.ora || p.orario || "15:00";
            const targetDate = new Date(`${p.data}T${matchOraUtc}:00Z`);
            return !isNaN(targetDate) && targetDate >= (adesso - 2 * 60 * 60 * 1000);
          });

          if (prossimoEvento) {
            const matchOraUtc = prossimoEvento.ora || prossimoEvento.orario || "15:00";
            const targetDate = new Date(`${prossimoEvento.data}T${matchOraUtc}:00Z`);

            let dataFormattata = prossimoEvento.data;
            let oraItaliana = matchOraUtc;

            if (!isNaN(targetDate)) {
              const dataRaw = targetDate.toLocaleDateString('it-IT', {
                timeZone: 'Europe/Rome',
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
              });
              dataFormattata = dataRaw.charAt(0).toUpperCase() + dataRaw.slice(1);

              oraItaliana = targetDate.toLocaleTimeString('it-IT', {
                timeZone: 'Europe/Rome',
                hour: '2-digit',
                minute: '2-digit'
              });
            }

            const isNextPrime = prossimoEvento.servizio && prossimoEvento.servizio.toLowerCase().includes("prime video");

            const badgeHtml = isNextPrime 
              ? '<span class="badge badge-prime">📦 Esclusiva Prime Video</span>' 
              : '<span class="badge badge-next">Prossimo Evento</span>';

            const primeNoticeHtml = isNextPrime 
              ? `<div class="notice-box-prime">
                   <div>ℹ️ <strong>Nota:</strong></div>
                   <div>Questa trasmissione è un'esclusiva <strong>Prime Video</strong>,<br>non sarà disponibile su Armadillo Streams.</div>
                 </div>` 
              : '';

            const nomeEvento = prossimoEvento.partita || prossimoEvento.gran_premio || prossimoEvento.evento || defaultTitle;

            app.innerHTML = `
              <div>
                ${badgeHtml}
                <h1>${nomeEvento}</h1>
                <p>
                  <strong>Data:</strong> ${dataFormattata} (${oraItaliana})<br>
                  <strong>Competizione:</strong> ${prossimoEvento.competizione || '-'}<br>
                  <strong>Piattaforma:</strong> ${prossimoEvento.servizio || '-'}
                </p>
                ${primeNoticeHtml}
                <div class="countdown-box">
                  Inizio tra:<br>
                  <strong id="${countdownPrefix}-match-cd">Calcolo in corso...</strong>
                </div>
              </div>
            `;

            function aggiornaCountdown() {
              const adessoOra = new Date();
              const differenza = targetDate - adessoOra;

              const countdownEl = document.getElementById(`${countdownPrefix}-match-cd`);
              if (!countdownEl) return;

              if (isNaN(differenza) || differenza <= 0) {
                countdownEl.textContent = "Evento in corso o appena iniziato!";
                return;
              }

              const giorni = Math.floor(differenza / (1000 * 60 * 60 * 24));
              const ore = Math.floor((differenza % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
              const minuti = Math.floor((differenza % (1000 * 60 * 60)) / (1000 * 60));
              const secondi = Math.floor((differenza % (1000 * 60)) / 1000);

              let testo = "";
              if (giorni > 0) testo += `${giorni}g `;
              testo += `${ore}h ${minuti}m ${secondi}s`;

              countdownEl.textContent = testo;
            }

            aggiornaCountdown();
            setInterval(aggiornaCountdown, 1000);

          } else {
            app.innerHTML = `
              <div>
                <span class="badge badge-inactive">Nessun Evento</span>
                <h1>Nessun evento in programma</h1>
                <p>Non ci sono prossime trasmissioni registrate nel calendario.</p>
              </div>
              <button disabled class="btn btn-disabled">Nessuno Stream Attivo</button>
            `;
          }
        } catch (calErr) {
          app.innerHTML = `
            <div>
              <span class="badge badge-inactive">Errore Calendario</span>
              <h1>Errore caricamento calendario</h1>
              <p>Dettaglio dell'errore:</p>
              <div class="error-box">${calErr.message}</div>
            </div>
            <button disabled class="btn btn-disabled" style="margin-top:15px">Nessuno Stream Attivo</button>
          `;
        }

      } catch (err) {
        app.innerHTML = `
          <div>
            <span class="badge badge-inactive">Errore Stream</span>
            <h1>Impossibile caricare i dati dello stream</h1>
            <div class="error-box">${err.message}</div>
          </div>
        `;
      }

      return { attivo: false };
    }

    async function init() {
      const startTime = Date.now();

      // Carica contemporaneamente i dati di Inter e F1
      const results = await Promise.allSettled([
        loadEventCard({
          elementId: 'app-inter',
          streamUrl: `${BASE_URL}stream.json`,
          calendarUrl: `${BASE_URL}calendar.json`,
          defaultTitle: 'Partita Inter',
          countdownPrefix: 'inter'
        }),
        loadEventCard({
          elementId: 'app-f1',
          streamUrl: `${BASE_URL}f1_stream.json`,
          calendarUrl: `${BASE_URL}f1_calendar.json`,
          defaultTitle: 'Gran Premio F1',
          countdownPrefix: 'f1'
        })
      ]);

      hideSplashScreen(startTime);

      // Filtra gli eventi che risultano in diretta adesso
      const activeStreams = results
        .filter(r => r.status === 'fulfilled' && r.value && r.value.attivo)
        .map(r => r.value);

      // CASO A: 2 Stream attivi contemporaneamente -> disabilita il redirect automatico e avvisa l'utente
      if (activeStreams.length > 1) {
        activeStreams.forEach(s => {
          const noteEl = document.getElementById(`${s.countdownPrefix}-note`);
          if (noteEl) {
            noteEl.innerHTML = `⚠️ <strong>Due eventi in diretta!</strong> Seleziona manualmente lo streaming da avviare.`;
          }
        });
      } 
      // CASO B: Soltanto 1 Stream attivo -> esegui il reindirizzamento automatico
      else if (activeStreams.length === 1) {
        const stream = activeStreams[0];
        let secondiRimanenti = 3;

        const timerEl = document.getElementById(`${stream.countdownPrefix}-cd`);
        const interval = setInterval(() => {
          secondiRimanenti--;
          if (timerEl) timerEl.textContent = secondiRimanenti;
          
          if (secondiRimanenti <= 0) {
            clearInterval(interval);
            window.location.href = stream.url;
          }
        }, 1000);
      }
    }

    init();
  </script>
</body>
</html>
