<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caricamento...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #010E80; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 95vh;
      width: 100vw;
      overflow: hidden;
      font-family: "Gill Sans Extrabold", sans-serif; /* Font */
    }

    .loader-png {
      max-width: 70vw;  
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
 
    /* Stile per la scritta Armadillo Interactive */
    .brand-text {
      margin-top: 8px;
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: sentencecase;
      text-align: center;
    }
  </style>
</head>
<body>
  
  <!-- Logo PNG -->
  <img src="logo.png" alt="Logo" class="loader-png">
  <div class="brand-text">Armadillo Interactive</div>

<script>
  // 1. Avvia il timer da 3 secondi subito all'apertura della pagina
  const timer3Secondi = new Promise(resolve => setTimeout(resolve, 3000));

  // 2. Scarica il link da stream.json in parallelo
  const recuperaLink = fetch('stream.json?t=' + Date.now())
    .then(response => response.json())
    .then(data => data.url);

  // 3. Esegui il reindirizzamento solo quando ENTRAMBE le azioni sono uscite con successo
  Promise.all([timer3Secondi, recuperaLink])
    .then(([_, url]) => {
      if (url) {
        window.location.href = url;
      }
    })
    .catch(err => {
      console.error("Errore nel caricamento del link:", err);
    });
</script>

</body>
</html>
