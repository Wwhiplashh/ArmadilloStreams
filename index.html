<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caricamento...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #010E80; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 95vh;
      width: 100vw;
      overflow: hidden;
      font-family: "Gill Sans Extrabold", sans-serif; /* Font */
      color: #ffffff;
    }

    .loader-png {
      max-width: 70vw;  
      max-height: 70vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .brand-text {
      margin-top: 8px;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: sentencecase;
      text-align: center;
    }

    /* Scritta con il conteggio */
    .counter-text {
      margin-top: 12px;
      font-size: 1rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- Logo e Scritta -->
  <img src="logo.png" alt="Logo" class="loader-png">
  <div class="brand-text">Armadillo Interactive</div>
  
  <!-- Indicatore visivo del timer -->
  <div class="counter-text" id="status">Reindirizzamento in 3...</div>

  <script>
    async function avvia() {
      let secondi = 3;
      const statusEl = document.getElementById('status');

      // 1. Avvia il download del JSON in background
      const fetchLink = fetch('stream.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => data.url)
        .catch(err => {
          console.error("Errore fetch:", err);
          return null;
        });

      // 2. Timer visivo di 3 secondi (1 secondo per ogni tick)
      const timer = new Promise(resolve => {
        const intervallo = setInterval(() => {
          secondi--;
          if (secondi > 0) {
            statusEl.textContent = `Reindirizzamento in ${secondi}...`;
          } else {
            clearInterval(intervallo);
            statusEl.textContent = "Connessione in corso...";
            resolve();
          }
        }, 1000);
      });

      // 3. Aspetta sia lo scadere del timer che il caricamento del link
      const [_, targetUrl] = await Promise.all([timer, fetchLink]);

      // 4. Reindirizza
      if (targetUrl) {
        window.location.href = targetUrl;
      } else {
        statusEl.textContent = "Errore: Link non trovato in stream.json";
      }
    }

    avvia();
  </script>

</body>
</html>
