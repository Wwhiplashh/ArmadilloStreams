<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caricamento...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #010E80; 
      display: flex;
      flex-direction: column; /* Dispone logo e testo in verticale */
      justify-content: center;
      align-items: center;
      height: 95vh;
      width: 100vw;
      overflow: hidden;
      font-family: "Gill Sans Extrabold", sans-serif; /* Font */
    }

    /* Immagine PNG */
    .loader-png {
      max-width: 70vw;  
      max-height: 70vh; /* Ridotto leggermente per far spazio al testo */
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* Stile per la scritta Armadillo Interactive */
    .brand-text {
      margin-top: 8px;       /* Spazio tra il logo e la scritta */
      color: #ffffff;         /* Colore bianco */
      font-size: 2.2rem;      /* Dimensione del testo */
      font-weight: 600;       /* Grassetto medio */
      letter-spacing: 2px;    /* Spaziatura tra le lettere */
      text-transform: Sentencecase; /* Prima lettera maiuscola */
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Logo PNG -->
  <img src="logo.png" alt="Logo" class="loader-png">

  <!-- Scritta sotto il logo -->
  <div class="brand-text">Armadillo Interactive</div>

  <script>
    fetch('stream.json?t=' + Date.now())
      .then(response => response.json())
      .then(data => {
        if (data.url) {
          window.location.href = data.url;
        }
      })
      .catch(err => {
        console.error("Errore nel caricamento del link:", err);
      });
  </script>

</body>
</html>
