<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armadillo Streams</title>

  <!-- Favicon e Icone -->
  <link rel="icon" type="image/x-icon" href="armadillo.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="armadillo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="armadillo.png">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* Colori estratti dal logo */
      --brand-gold: #e5a91a;
      --brand-gold-hover: #d99b0d;
      --brand-gold-soft: rgba(229, 169, 26, 0.12);
      --brand-red: #991b1b; /* Rosso dell'occhio del logo */
      
      --accent-inter: #0284c7;
      --accent-inter-soft: rgba(2, 132, 199, 0.12);
      --accent-f1: #dc2626;
      --accent-f1-soft: rgba(220, 38, 38, 0.12);
      --accent-live: #16a34a;
      --accent-live-soft: rgba(22, 163, 74, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 10% 10%, rgba(229, 169, 26, 0.08) 0px, transparent 40%),
        radial-gradient(at 90% 90%, rgba(2, 132, 199, 0.05) 0px, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* Splash Screen */
    #splash-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 260px;
      max-width: 70vw;
      height: auto;
      animation: logoPulse 1.8s infinite alternate ease-in-out;
    }

    @keyframes logoPulse {
      0% { transform: scale(0.96); opacity: 0.9; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    /* Card Principale (Hero / Diretta) */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-top: 4px solid var(--brand-gold);
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.07);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      margin-bottom: 24px;
    }

    /* Griglia per i due eventi futuri */
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.05);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }
    
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--brand-gold);
      box-shadow: 0 15px 35px -10px rgba(229, 169, 26, 0.15);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 18px;
      letter-spacing: 0.8px;
      align-self: center;
    }
    
    .badge-active { 
      background: var(--accent-live-soft); 
      color: var(--accent-live); 
      border: 1px solid rgba(22, 163, 74, 0.2);
    }
    .badge-next { 
      background: var(--brand-gold-soft); 
      color: #b47800; 
      border: 1px solid rgba(229, 169, 26, 0.3);
    }
    .badge-inactive { 
      background: #f1f5f9; 
      color: var(--text-muted); 
      border: 1px solid #e2e8f0;
    }
    .badge-overlap { 
      background: rgba(217, 119, 6, 0.12); 
      color: #d97706; 
      border: 1px solid rgba(217, 119, 6, 0.2);
    }
    
    h1 { font-size: 1.65rem; font-weight: 800; margin-bottom: 12px; color: var(--text-main); }
    h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main); }
    p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; margin-bottom: 18px; }
    
    .redirect-note {
      font-size: 0.85rem;
      margin-top: 16px;
      color: var(--text-muted);
    }
    .redirect-note strong { color: var(--brand-gold); }
    
    .countdown-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .countdown-box strong {
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: block;
      margin-top: 4px;
    }

    .error-box { 
      background: rgba(220, 38, 38, 0.08); 
      border: 1px solid rgba(220, 38, 38, 0.2); 
      padding: 12px; 
      border-radius: 12px; 
      font-family: monospace; 
      font-size: 0.82rem; 
      color: #991b1b; 
      margin-top: 12px; 
      text-align: left; 
    }
    
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      text-align: center;
      letter-spacing: 0.2px;
    }
    
    .btn-live { 
      background: var(--accent-live); 
      color: #ffffff; 
      box-shadow: 0 4px 15px rgba(22, 163, 74, 0.25); 
    }
    .btn-live:hover { 
      background: #15803d; 
      transform: translateY(-1px);
    }
    
    .btn-inter { 
      background: var(--accent-inter); 
      color: #ffffff; 
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25); 
    }
    .btn-inter:hover { 
      background: #0369a1; 
      transform: translateY(-1px);
    }
    
    .btn-f1 { 
      background: var(--brand-red); 
      color: #ffffff; 
      box-shadow: 0 4px 15px rgba(153, 27, 27, 0.25); 
    }
    .btn-f1:hover { 
      background: #7f1d1d; 
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="logo.png" alt="Logo Armadillo" class="splash-logo" onerror="this.src='armadillo.png'">
  </div>

  <div class="container" id="app">
    <div class="hero-card">
      <span class="badge badge-next">Verifica in corso</span>
      <h1>Connessione al server...</h1>
    </div>
  </div>

  <script>
    const REPO_USER = 'Wwhiplashh';
    const REPO_NAME = 'ArmadilloStreams';

    const BASE_URL = window.location.protocol === 'file:' 
      ? `https://raw.githubusercontent.com/${REPO_USER}/${REPO_NAME}/main/`
      : './';

    const STREAM_JSON_URL = `${BASE_URL}stream.json`;
    const CALENDAR_JSON_URL = `${BASE_URL}calendar.json`;
    const F1_CALENDAR_JSON_URL = `${BASE_URL}f1_calendar.json`;

    function nascondiSplash() {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('fade-out');
      }, 300);
    }

    function parseUTCDate(dataStr, oraStr) {
      if (!dataStr) return null;
      
      let cleanData = String(dataStr).trim();
      if (cleanData.includes('/')) {
        const parts = cleanData.split('/');
        if (parts.length === 3) {
          cleanData = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        }
      }

      let cleanOra = oraStr ? String(oraStr).trim().replace("Z", "") : "14:00";
      const oraParts = cleanOra.split(':');
      const hh = oraParts[0] ? oraParts[0].padStart(2, '0') : "14";
      const mm = oraParts[1] ? oraParts[1].padStart(2, '0') : "00";

      const isoString = `${cleanData}T${hh}:${mm}:00Z`;
      const dateObj = new Date(isoString);
      
      return isNaN(dateObj.getTime()) ? null : dateObj;
    }

    function isEventoLive(evento) {
      if (!evento || !evento.attivo || !evento.url || evento.in_chiaro) return false;
      
      if (evento.data && evento.ora) {
        const matchTime = parseUTCDate(evento.data, evento.ora);
        if (matchTime) {
          const adesso = new Date();
          const cinqueMinutiInMs = 5 * 60 * 1000;
          const orarioAttivazione = matchTime.getTime() - cinqueMinutiInMs;
          
          return adesso.getTime() >= orarioAttivazione;
        }
      }
      return false;
    }

    function trovaProssimoEvento(lista, tipo) {
      const adesso = new Date();
      let prossimo = null;
      let minDiff = Infinity;

      if (!Array.isArray(lista)) return null;

      lista.forEach(ev => {
        const dateObj = parseUTCDate(ev.data || ev.date, ev.ora || ev.orario || ev.time);
        if (!dateObj) return;

        const diff = dateObj - adesso;
        
        if (diff > -3 * 60 * 60 * 1000 && diff < minDiff) {
          minDiff = diff;
          prossimo = { ...ev, targetDate: dateObj, tipo };
        }
      });

      return prossimo;
    }

    async function initApp() {
      const app = document.getElementById('app');

      try {
        const [streamRes, calRes, f1CalRes] = await Promise.allSettled([
          fetch(STREAM_JSON_URL, { cache: 'no-store' }),
          fetch(CALENDAR_JSON_URL, { cache: 'no-store' }),
          fetch(F1_CALENDAR_JSON_URL, { cache: 'no-store' })
        ]);

        let streamData = {};
        if (streamRes.status === 'fulfilled' && streamRes.value.ok) {
          streamData = await streamRes.value.json();
        }

        let calendarioInter = [];
        if (calRes.status === 'fulfilled' && calRes.value.ok) {
          const data = await calRes.value.json();
          calendarioInter = Array.isArray(data) ? data : (data.partite || data.eventi || []);
        }

        let calendarioF1 = [];
        if (f1CalRes.status === 'fulfilled' && f1CalRes.value.ok) {
          const dataF1 = await f1CalRes.value.json();
          calendarioF1 = Array.isArray(dataF1) ? dataF1 : (dataF1.gare || dataF1.races || dataF1.partite || dataF1.eventi || []);
        }

        const eventoInter = streamData.inter || (streamData.partita ? streamData : null);
        const eventoF1 = streamData.f1 || null;

        const interLive = isEventoLive(eventoInter);
        const f1Live = isEventoLive(eventoF1);

        // CASO 1: CONCOMITANZA
        if (interLive && f1Live) {
          app.innerHTML = `
            <div class="hero-card">
              <span class="badge badge-overlap">⚠️ Sovrapposizione Eventi</span>
              <h1>Due eventi in diretta simultanea</h1>
              <p>Seleziona lo streaming che desideri guardare:</p>
              <div class="btn-container">
                <a href="${eventoInter.url}" class="btn btn-inter">⚽ INTER: ${eventoInter.partita || 'Partita Inter'}</a>
                <a href="${eventoF1.url}" class="btn btn-f1">🏎️ F1: ${eventoF1.partita || eventoF1.gara || eventoF1.gp || 'Gara F1'}</a>
              </div>
            </div>
          `;
          return;
        }

        // CASO 2: UN SOLO EVENTO IN DIRETTA
        const eventoAttivo = interLive ? eventoInter : (f1Live ? eventoF1 : null);
        const tipoEvento = interLive ? "⚽ Inter" : "🏎️ Formula 1";

        if (eventoAttivo) {
          let secondiRimanenti = 3;
          const titolo = eventoAttivo.partita || eventoAttivo.gara || eventoAttivo.gp || 'Evento in Diretta';

          app.innerHTML = `
            <div class="hero-card">
              <span class="badge badge-active">🔴 ${tipoEvento} In Diretta</span>
              <h1>${titolo}</h1>
              <p>
                <strong>Competizione:</strong> ${eventoAttivo.competizione || (interLive ? 'Serie A' : 'Formula 1')}<br>
                <strong>Piattaforma:</strong> ${eventoAttivo.servizio || 'Streaming'}
              </p>
              <a href="${eventoAttivo.url}" class="btn btn-live">AVVIA STREAMING</a>
              <p class="redirect-note">
                Reindirizzamento automatico tra <strong id="countdown">3</strong> secondi...
              </p>
            </div>
          `;

          const timerEl = document.getElementById('countdown');
          const interval = setInterval(() => {
            secondiRimanenti--;
            if (timerEl) timerEl.textContent = secondiRimanenti;
            if (secondiRimanenti <= 0) {
              clearInterval(interval);
              window.location.href = eventoAttivo.url;
            }
          }, 1000);
          return;
        }

        // CASO 3: NESSUN EVENTO IN DIRETTA
        mostraProssimiEventi(calendarioInter, calendarioF1);

      } catch (err) {
        app.innerHTML = `
          <div class="hero-card">
            <span class="badge badge-inactive">Errore Caricamento</span>
            <h1>Impossibile sincronizzare i dati</h1>
            <div class="error-box">${err.message}</div>
          </div>
        `;
      } finally {
        nascondiSplash();
      }
    }

    function mostraProssimiEventi(calInter, calF1) {
      const app = document.getElementById('app');

      const prossimoInter = trovaProssimoEvento(calInter, 'inter');
      const prossimoF1 = trovaProssimoEvento(calF1, 'f1');

      let html = '<div class="events-grid">';
      html += creaCardEvento(prossimoInter, '⚽ INTER', 'inter');
      html += creaCardEvento(prossimoF1, '🏎️ FORMULA 1', 'f1');
      html += '</div>';

      app.innerHTML = html;

      if (prossimoInter) avviaTimerCard(prossimoInter, 'timer-inter');
      if (prossimoF1) avviaTimerCard(prossimoF1, 'timer-f1');

      setInterval(async () => {
        try {
          const res = await fetch(STREAM_JSON_URL, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            const interLive = isEventoLive(data.inter || (data.partita ? data : null));
            const f1Live = isEventoLive(data.f1);
            if (interLive || f1Live) {
              location.reload();
            }
          }
        } catch (e) {}
      }, 30000);
    }

    function creaCardEvento(evento, titoloSport, tipo) {
      if (!evento) {
        return `
          <div class="card">
            <span class="badge badge-inactive">${titoloSport}</span>
            <h2>Nessun evento</h2>
            <p>Nessuna gara o partita in programma a breve.</p>
          </div>
        `;
      }

      const dataFormatted = evento.targetDate.toLocaleDateString('it-IT', {
        timeZone: 'Europe/Rome',
        weekday: 'short',
        day: 'numeric',
        month: 'short'
      });
      const dataFormattata = dataFormatted.charAt(0).toUpperCase() + dataFormatted.slice(1);
      
      const oraItaliana = evento.targetDate.toLocaleTimeString('it-IT', {
        timeZone: 'Europe/Rome',
        hour: '2-digit',
        minute: '2-digit'
      });

      const nomeEvento = evento.partita || evento.gara || evento.gp || evento.nome || evento.titolo || 'Prossimo Evento';
      const comp = evento.competizione || (tipo === 'f1' ? 'Formula 1' : 'Serie A');

      return `
        <div class="card">
          <div>
            <span class="badge badge-next">${titoloSport}</span>
            <h2>${nomeEvento}</h2>
            <p>
              <strong>Data:</strong> ${dataFormattata} ore ${oraItaliana}<br>
              <strong>Competizione:</strong> ${comp}<br>
              <strong>Canale:</strong> ${evento.servizio || evento.canale || 'Sky / NOW'}
            </p>
          </div>
          <div class="countdown-box">
            Inizio tra:<br>
            <strong id="timer-${tipo}">Calcolo in corso...</strong>
          </div>
        </div>
      `;
    }

    function avviaTimerCard(evento, elementId) {
      function aggiorna() {
        const timerEl = document.getElementById(elementId);
        if (!timerEl) return;

        const adesso = new Date();
        const diff = evento.targetDate - adesso;

        if (diff <= 0) {
          timerEl.innerHTML = '<span style="color: #0284c7;">🔴 In attesa di segnale streaming...</span>';
          return;
        }

        const giorni = Math.floor(diff / (1000 * 60 * 60 * 24));
        const ore = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minuti = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secondi = Math.floor((diff % (1000 * 60)) / 1000);

        let testo = "";
        if (giorni > 0) testo += `${giorni}g `;
        testo += `${ore}h ${minuti}m ${secondi}s`;

        timerEl.textContent = testo;
      }

      aggiorna();
      setInterval(aggiorna, 1000);
    }

    initApp();
  </script>
</body>
</html>
