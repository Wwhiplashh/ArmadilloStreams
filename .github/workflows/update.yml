name: Aggiorna Stream JSON

on:
  schedule:
    # Esegue lo script ogni ora (modificabile se necessario)
    - cron: '0 * * * *'
  workflow_dispatch: # Permette l'esecuzione manuale da GitHub Actions
  push:
    branches:
      - main
    paths:
      - 'calendar.json'
      - 'f1_calendar.json'
      - 'aggiorna_stream.py'

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui aggiorna_stream.py
        run: python aggiorna_stream.py

      - name: Commit e Push dei cambiamenti su stream.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stream.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stream.json" && git push)
