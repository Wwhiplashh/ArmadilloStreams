name: Aggiornamento Automatico Partite Inter e F1

on:
  schedule:
    # Esegue ogni lunedì alle 04:00 UTC per aggiornare i calendari
    - cron: '0 4 * * 1'
    # Esegue ogni giorno alle 00:00 UTC per aggiornare lo stato degli stream
    - cron: '0 0 * * *'
  workflow_dispatch: # Permette l'avvio manuale da GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          
      - name: Installa dipendenze
        run: pip install requests
        
      - name: Scarica Calendario Partite dell'Inter
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python fetch_inter_api.py

      - name: Genera stream.json per la data odierna
        run: python aggiorna_stream.py
        
      - name: Scarica Calendario Corse F1
        run: python fetch_f1_api.py
        
      - name: Commit e Push delle modifiche
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Aggiunge tutti i file modificati (Inter + F1)
          git add .
          
          # Esegue il commit ed il push solo se ci sono effettive modifiche staged
          git diff --staged --quiet || (git commit -m "🤖 Auto-update Inter e F1 [skip ci]" && git push)
